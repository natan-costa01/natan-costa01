
name: Gerar Space Shooter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/space-shooter.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Gerar Space Shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: natan-costa01
          output-path: space-shooter.gif
          strategy: random
          fps: 40

      - name: Publicar GIF no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add space-shooter.gif

          if ! git diff --cached --quiet; then
            git commit -m "Atualizar Space Shooter"
            git push
          fi
